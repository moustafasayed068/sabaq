<div class="hms" role="group">{% for sub in widget.subwidgets %}
  <label><input type="text" inputmode="numeric" pattern="[0-9]*" maxlength="2" autocomplete="off" name="{{ sub.name }}"{% if sub.value is not None %} value="{{ sub.value }}"{% endif %}{% for k, v in sub.attrs.items %} {{ k }}="{{ v }}"{% endfor %}><span>{{ sub.unit }}</span></label>{% if not forloop.last %}<span class="sep" aria-hidden="true">:</span>{% endif %}{% endfor %}
</div>
