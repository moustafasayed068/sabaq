<ul class="chips"{% if widget.attrs.id %} id="{{ widget.attrs.id }}"{% endif %}>{% for group, options, index in widget.optgroups %}{% for option in options %}
  <li><label class="chip" for="{{ option.attrs.id }}"><input type="{{ option.type }}" name="{{ option.name }}" value="{{ option.value|stringformat:'s' }}" id="{{ option.attrs.id }}"{% if option.selected %} checked{% endif %}{% if widget.required and option.type == 'radio' %} required{% endif %}><span>{{ option.label }}</span></label></li>{% endfor %}{% endfor %}
</ul>
