{# include "components/notice.html" with kind="info|warn|stop" title="..." text="..." #}
<div class="notice{% if kind and kind != 'info' %} notice-{{ kind }}{% endif %}" role="{% if kind == 'stop' %}alert{% else %}status{% endif %}">
  {% if title %}<p class="notice-title">{{ title }}</p>{% endif %}
  {% if text %}<p>{{ text }}</p>{% endif %}
</div>
